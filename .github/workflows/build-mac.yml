name: Сборка для macOS

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'test/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Тесты парсера
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  mac:
    name: Сборка .dmg / .zip
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: electron-builder
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Артефакт для Apple Silicon
        uses: actions/upload-artifact@v5
        with:
          name: togu-raspisanie-mac-arm64
          path: dist/*-arm64.dmg
          if-no-files-found: error
          compression-level: 0
      - name: Артефакт для Intel
        uses: actions/upload-artifact@v5
        with:
          name: togu-raspisanie-mac-x64
          path: dist/*-x64.dmg
          if-no-files-found: error
          compression-level: 0
      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
